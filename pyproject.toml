[project]
name = "esa-release-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "httpx2>=2.16.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[tool.ty.src]
include = ["scripts"]

[tool.ruff]
include = ["scripts/**/*.py"]
